# Build 32 bits da camada e do shim (multilib do Fedora):
#   meson setup build32 --cross-file cross/i686-linux.ini -Dlayer_only=true --libdir=lib
[binaries]
c = ['gcc', '-m32']
cpp = ['g++', '-m32']
ar = 'ar'
strip = 'strip'
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = ['/usr/lib/pkgconfig', '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
